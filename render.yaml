services:
  - type: web
    runtime: node
    name: prematch-tracker-api
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MANAGER_SIGNUP_CODE
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SCREENSHOT_BUCKET
        value: prematch-screenshots
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false

  - type: web
    runtime: static
    name: prematch-tracker
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
